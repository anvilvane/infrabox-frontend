<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Premium Inboxes Review 2026 — Infrabox editorial analysis">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001a68"/>
      <stop offset="100%" stop-color="#001a68"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.55">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#34D399" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#f5f8ff" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <line x1="96" y1="200" x2="1504" y2="200" stroke="url(#rule)" stroke-width="1"/>

  <g transform="translate(96, 96)">
    <g transform="scale(0.56)" fill="#f5f8ff">
      <polygon points="50,35 35,20 35,30 15,30 15,40 35,40 35,50"/>
      <polygon points="65,50 65,40 85,40 85,30 65,30 65,20 50,35"/>
      <polygon points="50,65 35,80 35,70 15,70 15,60 35,60 35,50"/>
      <polygon points="65,50 65,60 85,60 85,70 65,70 65,80 50,65"/>
    </g>
    <text x="72" y="46" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" font-size="30" fill="#f5f8ff" letter-spacing="-0.5">Infrabox</text>
  </g>

  <text x="1504" y="142" text-anchor="end" font-family="Figtree, system-ui, -apple-system, sans-serif" font-weight="500" font-size="18" fill="#f5f8ff" fill-opacity="0.45" letter-spacing="4">infrabox.software  /  LEARN</text>

  <g transform="translate(96, 360)">
    <circle cx="6" cy="-7" r="6" fill="#34D399"/>
    <circle cx="6" cy="-7" r="11" fill="#34D399" fill-opacity="0.18"/>
    <text x="30" y="0" font-family="Figtree, system-ui, -apple-system, sans-serif" font-weight="600" font-size="22" fill="#34D399" letter-spacing="6">REVIEW  ·  2026</text>
  </g>

  <text x="96" y="500" font-family="Figtree, system-ui, -apple-system, sans-serif" font-weight="700" font-size="124" fill="#f5f8ff" letter-spacing="-4">Premium Inboxes</text>

  <text x="96" y="580" font-family="Figtree, system-ui, -apple-system, sans-serif" font-weight="500" font-size="38" fill="#f5f8ff" fill-opacity="0.55" letter-spacing="-0.5">Service-led Google Workspace and Microsoft 365 provisioning.</text>

  <g transform="translate(96, 800)">
    <text x="0" y="0" font-family="Figtree, system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#f5f8ff" fill-opacity="0.55">11 min read</text>
    <circle cx="118" cy="-7" r="3" fill="#f5f8ff" fill-opacity="0.35"/>
    <text x="138" y="0" font-family="Figtree, system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#f5f8ff" fill-opacity="0.55">Independent editorial analysis</text>
  </g>

  <g transform="translate(1304, 794)">
    <rect x="0" y="0" width="40" height="6" fill="#34D399" fill-opacity="0.4" rx="2"/>
    <rect x="48" y="0" width="80" height="6" fill="#34D399" fill-opacity="0.7" rx="2"/>
    <rect x="136" y="0" width="160" height="6" fill="#34D399" rx="2"/>
